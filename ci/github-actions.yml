name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build images
      - name: Build Docker images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest ./backend/user-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest ./backend/product-service

      # Step 5: Run tests (optional, add your test commands)
      - name: Run tests
        run: echo "No tests yet - add later"

      # Step 6: Security scan with Trivy
      - name: Scan images with Trivy
        uses: aquasecurity/trivy-action@0.12.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

      # Step 7: Push images to Docker Hub
      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest

